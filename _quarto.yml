# Site configuration for https://tdmize.github.io/stata/
#
# One Quarto project, one sidebar per package. A page shows the sidebar that
# lists it, so each package reads as its own small site (and can be embedded
# on its own Google Sites page). To add a page: create it under
# <pkg>/_src/, run build.do, and add it to that package's sidebar below.

project:
  type: website
  output-dir: docs          # GitHub Pages serves this folder (Settings > Pages > /docs)

website:
  title: "Stata software — Trenton D. Mize"
  site-url: "https://tdmize.github.io/stata/"
  page-navigation: true     # previous/next links at the bottom of each page
  back-to-top-navigation: true
  search:
    location: sidebar
    type: overlay
  page-footer:
    left: "Trenton D. Mize · [trentonmize.com](https://www.trentonmize.com)"
    right: "Built with [Quarto](https://quarto.org)"

  sidebar:

    # ---------------------------------------------------------------- mecompare
    - id: mecompare
      title: "mecompare"
      style: docked
      collapse-level: 3
      tools:
        - icon: house-door
          text: "trentonmize.com"
          href: https://www.trentonmize.com/software/mecompare
        - icon: github
          text: "GitHub"
          href: https://github.com/tdmize
      contents:
        - text: "Overview"
          href: mecompare/index.qmd
        - mecompare/getting-started.qmd
        - mecompare/options.qmd
        - mecompare/plotting.qmd
        - section: "Examples"
          contents:
            - section: "Mize, Doan & Long (2019)"
              contents:
                - mecompare/examples/mediation.qmd
                - mecompare/examples/nested-models.qmd
                - mecompare/examples/alternative-predictors.qmd
                - mecompare/examples/different-outcomes.qmd
                - mecompare/examples/model-types.qmd
                - mecompare/examples/groups.qmd
            - section: "Mize & Han (2025)"
              contents:
                - mecompare/examples/within-model.qmd
                - mecompare/examples/meinequality-across-models.qmd
                - mecompare/examples/totalme-across-models.qmd
            - section: "Mize & Han (forthcoming)"
              contents:
                - mecompare/examples/chapter-summary-measures.qmd
                - mecompare/examples/chapter-interactions.qmd
                - mecompare/examples/chapter-groups.qmd
        - section: "Interactions: Mize (2019)"
          contents:
            - text: "Overview"
              href: mecompare/interactions/index.qmd
            - mecompare/interactions/linear-model.qmd
            - mecompare/interactions/nominal-by-nominal.qmd
            - mecompare/interactions/nominal-by-continuous.qmd
            - mecompare/interactions/continuous-by-continuous.qmd
        - mecompare/help-examples.qmd
        - text: "help mecompare"
          href: mecompare/help.qmd

    # ------------------------------------------------------------------- suest2
    - id: suest2
      title: "suest2"
      style: docked
      collapse-level: 2
      tools:
        - icon: house-door
          text: "trentonmize.com"
          href: https://www.trentonmize.com/software/suest2
        - icon: github
          text: "GitHub"
          href: https://github.com/tdmize
      contents:
        - text: "Overview"
          href: suest2/index.qmd
        - suest2/usage.qmd
        - suest2/plotting.qmd
        - suest2/help-examples.qmd
        - text: "help suest2"
          href: suest2/help.qmd

    # ------------------------------------------------------------------- metest
    - id: metest
      title: "metest"
      style: docked
      tools:
        - icon: house-door
          text: "trentonmize.com"
          href: https://www.trentonmize.com/software/metest
        - icon: github
          text: "GitHub"
          href: https://github.com/tdmize
      contents:
        - text: "Overview"
          href: metest/index.qmd
        - metest/usage.qmd
        - text: "help metest"
          href: metest/help.qmd

    # ------------------------------------------------------------- meinequality
    - id: meinequality
      title: "meinequality"
      style: docked
      collapse-level: 2
      tools:
        - icon: house-door
          text: "trentonmize.com"
          href: https://www.trentonmize.com/software/meineq
        - icon: github
          text: "GitHub"
          href: https://github.com/tdmize
      contents:
        - text: "Overview"
          href: meinequality/index.qmd
        - meinequality/options.qmd
        - section: "Examples"
          contents:
            - meinequality/examples/summary-measure.qmd
            - meinequality/examples/categorical-models.qmd
            - meinequality/examples/across-models.qmd
            - meinequality/examples/across-groups.qmd
        - meinequality/help-examples.qmd
        - text: "help meinequality"
          href: meinequality/help.qmd

    # ------------------------------------------------------------------ totalme
    - id: totalme
      title: "totalme"
      style: docked
      collapse-level: 2
      tools:
        - icon: house-door
          text: "trentonmize.com"
          href: https://www.trentonmize.com/software/totalme
        - icon: github
          text: "GitHub"
          href: https://github.com/tdmize
      contents:
        - text: "Overview"
          href: totalme/index.qmd
        - totalme/options.qmd
        - section: "Examples"
          contents:
            - totalme/examples/single-model.qmd
            - totalme/examples/across-models.qmd
            - totalme/examples/inequalities.qmd
        - totalme/help-examples.qmd
        - text: "help totalme"
          href: totalme/help.qmd

    # -------------------------------------------------------------- balanceplot
    - id: balanceplot
      title: "balanceplot"
      style: docked
      collapse-level: 2
      tools:
        - icon: house-door
          text: "trentonmize.com"
          href: https://www.trentonmize.com/software/balanceplot
        - icon: github
          text: "GitHub"
          href: https://github.com/tdmize
      contents:
        - text: "Overview"
          href: balanceplot/index.qmd
